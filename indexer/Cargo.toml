[package]
name = "divi-overlay-indexer"
version = "0.2.0"
edition = "2021"
description = "Runs the shared Divi overlay scanner next to this explorer's node. Contains no protocol logic and no scanner of its own."

[[bin]]
name = "divi-overlay-indexer"
path = "src/main.rs"

[dependencies]
# The scanner AND the protocol rules, vendored by sync-crates.sh and never
# edited here. This repo used to carry its own scanner; see README.
dvxp-scan = { path = "vendor/dvxp-scan" }

[profile.release]
opt-level = 2
